services:
  heatmiser-mqtt:
    image: heatmiser-mqtt:latest
    container_name: heatmiser-mqtt
    restart: unless-stopped
    environment:
      NEOHUB_HOST: "192.168.1.139"
      MQTT_ROOT: "heatmiser"
      MQTT_HOST: "mqtt.internal"
      MQTT_CLIENT_NAME: "heatmiser-mqtt"

    init: true
    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"